apiVersion: skaffold/v2alpha3
kind: Config
deploy:
  kubectl:
    manifests:
      - infra/k8s/auth-depl.yaml
      - infra/k8s/ingress-srv.yaml
      - infra/k8s/auth-mongo-depl.yaml
      - infra/k8s/client-depl.yaml
      - infra/k8s/tickets-depl.yaml
      - infra/k8s/tickets-monog-depl.yaml
      - infra/k8s/nats-depl.yaml
      - infra/k8s/orders-depl.yaml
      - infra/k8s/orders-mongo-depl.yaml

build:
  local:
    push: false
  artifacts:
    - image: minhajxdd/auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: minhajxdd/client
      context: client
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: '**/*.tsx'
            dest: .
    - image: minhajxdd/tickets
      context: tickets
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .
    - image: minhajxdd/orders
      context: orders
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: 'src/**/*.ts'
            dest: .